<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roue Chromatique d'Atelier (RYB) v3.4</title>
    <style>
        :root {
            --bg-color: #12141a;
            --panel-bg: #1c202a;
            --card-inner: #161922;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #2d3748;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 1.7rem;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 350px 430px 400px;
            gap: 20px;
            max-width: 1240px;
            width: 100%;
            align-items: start;
        }

        @media (max-width: 1200px) {
            .workspace-grid {
                grid-template-columns: 1fr;
                justify-items: center;
            }
            .left-panel, .center-panel, .right-panel {
                width: 100%;
                max-width: 500px;
            }
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .card:last-child {
            margin-bottom: 0;
        }

        .card h2 {
            font-size: 1.05rem;
            margin: 0 0 12px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wheel-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        .wheel-wrapper {
            position: relative;
            width: 390px;
            height: 390px;
            touch-action: none;
            cursor: grab;
        }

        .wheel-wrapper:active {
            cursor: grabbing;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .wheel-nav {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            width: 100%;
            justify-content: center;
        }

        .nav-btn {
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
